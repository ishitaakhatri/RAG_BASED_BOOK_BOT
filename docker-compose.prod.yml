version: '3.8'

services:
  backend:
    build: ./backend
    container_name: rag_bot_backend
    restart: always
    env_file: .env
    depends_on:
      - grobid

  redis:
    image: redis:7-alpine
    container_name: rag_bot_redis
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    container_name: rag_bot_celery_worker
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - redis
      - grobid
    env_file: ./backend/.env
    restart: always

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: rag_bot_grobid
    restart: always
    environment:
      - JAVA_OPTS=-XX:-UseContainerSupport

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: rag_bot_frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: rag_bot_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend