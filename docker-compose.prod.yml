version: '3.8'

services:
  backend:
    build: ./backend
    container_name: rag_bot_backend
    restart: always
    env_file: .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rag_bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  celery_worker:
    build: ./backend
    container_name: rag_bot_celery_worker
    # Command matches the refactored celery_worker.py module
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - redis
      - grobid
    env_file: ./backend/.env
    restart: always
    # Shared memory increased for PyTorch/AI operations
    shm_size: '2gb'

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: rag_bot_grobid
    restart: always
    environment:
      # Increased heap size for handling large PDFs
      - JAVA_OPTS=-Xmx4g -Dorg.grobid.max.connections=10
    ports:
      - "8070:8070"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: rag_bot_frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: rag_bot_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  redis_data: