version: "3.8"

services:
  backend:
    build:
      context: ./backend
    depends_on:
      - redis
      - grobid
    environment:
      - REDIS_URL=redis://redis:6379
      - GROBID_URL=http://grobid:8070

  redis:
    image: redis:7-alpine
    container_name: rag_book_bot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: rag_book_bot_grobid
    ports:
      - "8070:8070"
    environment:
      - GROBID_HOME=/opt/grobid/grobid-home
    volumes:
      - grobid-data:/opt/grobid/grobid-home/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  grobid-data:
    driver: local

